name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Garde-fou issue #5 : aucune page d'erreur HTML déguisée en photo dans public/img/
      - name: Signatures des images
        run: npm run check:images

      - name: Tests
        run: npm test

  # Écran d'administration (app/, servi sous /admin/) : ses propres
  # dépendances, son typecheck, ses essais d'écran (jsdom) et son build.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (textes, typecheck, Vite)
        run: npm run build

      - name: Tests d'écran
        run: npm test
