name: Connecteur MCP

on:
  push:
    branches: [main]
    paths: ['mcp/**', '.github/workflows/mcp.yml']
  pull_request:
    branches: [main]
    paths: ['mcp/**', '.github/workflows/mcp.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
