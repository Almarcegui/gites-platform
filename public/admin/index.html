<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Gestion Gîtes — back-office</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <!-- Navigation « variante B » (issue #25) : cinq entrées de premier niveau,
       dont trois à compteur, et un deuxième niveau contextuel. Les entrées
       sont construites par app.js (NAV) pour que routeur et menu ne puissent
       pas diverger. -->
  <header class="nav">
    <a class="brand" href="#/dash">⌂ Gestion Gîtes</a>
    <nav class="lvl1" id="nav1" aria-label="Navigation principale"></nav>
    <div class="navend">
      <span class="switch">Domaine : <span id="propertySwitch"></span></span>
      <a id="publicLink" href="/book/" target="_blank" rel="noopener">Page de réservation ↗</a>
      <a href="#" id="logout">Se déconnecter<span id="whoami"></span></a>
    </div>
  </header>
  <nav class="lvl2" id="nav2" aria-label="Sections"></nav>

  <main>
    <header class="top">
      <h2 id="pageTitle">Aujourd'hui</h2>
    </header>
    <div id="main"><div class="card">Chargement…</div></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<!-- Région d'annonce, hors des zones re-rendues : un message posé ici survit
     au rafraîchissement de la vue qui vient de l'émettre. -->
<p id="calLive" class="sr" aria-live="polite" role="status"></p>
<script type="module" src="app.js"></script>
</body>
</html>
