<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Gestion Gîtes — connexion</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card {
    background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.08);
    padding: 32px 28px; width: 100%; max-width: 380px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 22px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  select, input {
    width: 100%; padding: 10px 12px; font-size: 15px;
    border: 1px solid #d1d5db; border-radius: 8px; background: #fff;
  }
  select:focus, input:focus { outline: 2px solid #2f6b4f33; border-color: #2f6b4f; }
  button {
    width: 100%; margin-top: 20px; padding: 11px; font-size: 15px; font-weight: 600;
    color: #fff; background: #2f6b4f; border: 0; border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #275a42; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
  .msg.err { display: block; background: #fef2f2; color: #b91c1c; }
  .msg.warn { display: block; background: #fffbeb; color: #92400e; }
</style>
</head>
<body>
<form class="card" id="f">
  <h1>⌂ Gestion Gîtes</h1>
  <div class="sub">Back-office — accès réservé</div>
  <label for="user">Identifiant</label>
  <input id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <label for="pw">Mot de passe</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button id="go" type="submit">Se connecter</button>
  <div class="msg" id="m"></div>
</form>
<script>
  const m = document.getElementById("m");
  function show(kind, text) { m.className = "msg " + kind; m.textContent = text; }

  const last = localStorage.getItem("gp_last_user");
  if (last) { document.getElementById("user").value = last; document.getElementById("pw").focus(); }

  // Arrivée depuis l'app quand le serveur répond « verrou pas activé » (503).
  if (new URLSearchParams(location.search).get("verrou") === "inactif") {
    show("warn", "Le verrou du back-office n'est pas encore activé côté serveur (secret ADMIN_TOKEN à poser). La connexion ne fonctionnera qu'après.");
  }

  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const go = document.getElementById("go");
    go.disabled = true;
    try {
      const res = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          user: document.getElementById("user").value,
          password: document.getElementById("pw").value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        localStorage.setItem("gp_user", data.user);
        localStorage.setItem("gp_last_user", data.user);
        if (data.session) {
          // Compte en base : session de 30 jours, le mot de passe n'est pas conservé.
          localStorage.setItem("gp_session", data.session);
          localStorage.removeItem("gp_token");
        } else {
          // Accès de secours (secret) : le navigateur garde id:mdp.
          localStorage.setItem("gp_token", document.getElementById("pw").value);
          localStorage.removeItem("gp_session");
        }
        location.href = "./";
        return;
      }
      if (res.status === 503) {
        show("warn", "Le verrou n'est pas encore activé côté serveur — pose du secret ADMIN_TOKEN requise avant de pouvoir se connecter.");
      } else {
        show("err", data.error || "Connexion refusée.");
      }
    } catch {
      show("err", "Serveur injoignable — réessaie dans un instant.");
    } finally {
      go.disabled = false;
    }
  });
</script>
</body>
</html>
