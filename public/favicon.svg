<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Les Gîtes du Pré Moré">
  <!-- La roue hydraulique du moulin, reprise du logo historique du domaine.
       Or (#E9B44C) sur vert forêt (#22301F) — les deux couleurs de la charte
       (public/site.css : --gold, --accent-dark). Tracés épais pour rester
       lisibles à 16 px dans un onglet. -->
  <rect width="32" height="32" rx="6" fill="#22301F"/>
  <g fill="none" stroke="#E9B44C" stroke-width="2.4" stroke-linecap="round">
    <circle cx="16" cy="16" r="9"/>
    <path d="M16 7v18M7 16h18M9.6 9.6l12.8 12.8M22.4 9.6L9.6 22.4"/>
  </g>
  <circle cx="16" cy="16" r="2.6" fill="#E9B44C"/>
</svg>
